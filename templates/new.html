{% extends "base.html" %}{% block content %}
<h2>Report a Problem</h2>
<form method="post"><label>Category</label>
<select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select>
<label>Location (e.g. Lab 3, Room 204)</label><input name="location" required>
<label>Description</label><textarea name="description" rows="5" required></textarea>
<button>Submit</button></form>
{% endblock %}
